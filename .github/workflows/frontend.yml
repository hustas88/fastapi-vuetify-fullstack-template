name: Frontend

# Mirrors the `frontend:build` GitLab job (ci/frontend.gitlab-ci.yml):
# typecheck, static build, and the "no dev tooling in the bundle" invariant.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node and pnpm versions match the frontend Dockerfile build args.
      - uses: pnpm/action-setup@v4
        with:
          version: "12.18.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/frontend typecheck
      - run: pnpm --filter @app/frontend build

      # AGENTS.md invariant: dev-only UI (Mailpit, API docs) must not reach the
      # production bundle. `grep` returns 1 when nothing matches, which is what
      # we want; `-v` flips nothing, so test the count explicitly.
      - name: Assert no dev-tooling strings in dist
        run: |
          if grep -rio 'mailpit' frontend/dist | head -1 | grep -q .; then
            echo "::error::dev-only strings leaked into frontend/dist"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
