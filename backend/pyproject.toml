[project]
name = "app"
version = "0.1.0"
description = "FastAPI backend for the FastAPI + Vuetify full-stack template"
readme = "README.md"
requires-python = ">=3.15,<4.0"
dependencies = [
  "fastapi[standard]>=0.162.2,<1.0.0",
  "sqlmodel>=0.0.48,<1.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "alembic>=1.19.1,<2.0.0",
  "psycopg[binary]>=3.3.6,<4.0.0",
  "pyjwt>=2.15.0,<3.0.0",
  "pwdlib[argon2]>=0.3.1,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0,<10.0.0",
  "httpx>=0.27.0,<1.0.0",
  "ruff>=0.16.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG", # unused arguments
  "SIM", # flake8-simplify
  "T201",# no print statements
]
ignore = [
  "E501", # line length is handled by the formatter
  "B008", # FastAPI uses function calls in defaults (Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# `alembic/` is a local directory, so make sure the package is not treated as
# first-party by the import sorter.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Fail the suite if anything we exercise is deprecated, so stdlib/Pydantic/
# SQLModel removals show up as a red test instead of a warning nobody reads.
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
]
